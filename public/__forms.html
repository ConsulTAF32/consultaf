<!--
  Static form definition that Netlify's build bot parses at deploy time.
  Next.js renders the real form client-side, where the bot can't see it, so
  this hidden file is what registers the "contact" form + its fields.
  The visible form (src/components/ContactForm.tsx) submits to /__forms.html.
  Do not delete: without it, submissions return 404.
-->
<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <title>ConsulTAF — definiție formulare</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
